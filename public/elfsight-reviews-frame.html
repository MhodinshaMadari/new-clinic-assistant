<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Place Reviews</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }
    #widget-wrapper {
      width: 100%;
      min-height: 380px;
    }
  </style>
  <script>
    // Safeguard error handling inside the isolated review iframe
    window.addEventListener('error', function(event) {
      if (event && event.message && event.message.indexOf('styled-components') !== -1) {
        event.preventDefault();
        console.warn('[Review Frame] Handled styled-components notice:', event.message);
      }
    });
  </script>
  <script src="https://elfsightcdn.com/platform.js" async></script>
</head>
<body>
  <div id="widget-wrapper"></div>
  <script>
    (function() {
      try {
        var params = new URLSearchParams(window.location.search);
        var appId = params.get('appId') || '9fd444a6-3e6e-4605-89b6-b141a3f5b4fa';
        appId = appId.replace(/[^a-zA-Z0-9_-]/g, '') || '9fd444a6-3e6e-4605-89b6-b141a3f5b4fa';
        var container = document.getElementById('widget-wrapper');
        var widgetDiv = document.createElement('div');
        widgetDiv.className = 'elfsight-app-' + appId;
        widgetDiv.setAttribute('data-elfsight-app-lazy', '');
        container.appendChild(widgetDiv);
      } catch (err) {
        console.warn('[Review Frame] Widget mount error:', err);
      }
    })();
  </script>
</body>
</html>
